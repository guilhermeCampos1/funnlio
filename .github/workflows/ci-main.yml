name: CI — Live (main)

on:
  pull_request:
    branches: [main]

jobs:
  validate-source:
    name: Verificar origem do PR (somente stage ou hotfix)
    runs-on: ubuntu-latest
    steps:
      - name: Bloquear PRs que não venham de stage ou hotfix/*
        run: |
          SOURCE="${{ github.head_ref }}"
          echo "Branch de origem: $SOURCE"
          if [[ "$SOURCE" != "stage" && "$SOURCE" != hotfix/* ]]; then
            echo "❌ BLOQUEADO: PRs para main (Live) só podem vir de 'stage' ou 'hotfix/*'."
            echo "Tentativa bloqueada de: $SOURCE"
            echo ""
            echo "Fluxo correto: feature → develop → stage → main"
            exit 1
          fi
          echo "✅ Origem válida: $SOURCE"

  ci:
    name: Type-check + Build completo
    runs-on: ubuntu-latest
    needs: validate-source

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - name: Verificar secrets expostos no código
        run: |
          echo "Verificando padrões de secrets no código..."
          if grep -rE "(AKIA[0-9A-Z]{16}|sk-[a-zA-Z0-9]{40,}|ghp_[a-zA-Z0-9]{36})" \
            --include="*.ts" --include="*.tsx" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist .; then
            echo "❌ BLOQUEADO: Possíveis secrets hardcoded encontrados no código."
            exit 1
          fi
          echo "✅ Nenhum secret hardcoded detectado."

      - name: Verificar .env não commitado
        run: |
          if git ls-files | grep -E "^\.env(\.local|\.production|\.staging)?$"; then
            echo "❌ BLOQUEADO: Arquivo .env encontrado no repositório."
            exit 1
          fi
          echo "✅ Nenhum arquivo .env commitado."
